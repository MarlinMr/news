services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geonews_web
    restart: always
    ports:
      - "8080:80"
    environment:
      MARIADB_HOST: ${MARIADB_HOST:-db}
      MARIADB_PORT: ${MARIADB_PORT:-3306}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-geonews}
      MARIADB_USER: ${MARIADB_USER:-geonews_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-geonews_password}
      NOMINATIM_URL: ${NOMINATIM_URL:-https://nominatim.openstreetmap.org}
      TILE_SERVER_URL: ${TILE_SERVER_URL:-}
      TILE_SERVER_ATTRIBUTION: ${TILE_SERVER_ATTRIBUTION:-}
      TILE_SERVERS: ${TILE_SERVERS:-}
      RAILWAY_TILE_URL: ${RAILWAY_TILE_URL:-}
    volumes:
      - pdf_data:/pdf
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    container_name: geonews_db
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_secret_pass}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-geonews}
      MARIADB_USER: ${MARIADB_USER:-geonews_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-geonews_password}
    volumes:
      - ./docker/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  pdf_data:
