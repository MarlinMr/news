services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geonews_web
    restart: always
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: geonews
      DB_USER: geonews_user
      DB_PASS: geonews_password
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    container_name: geonews_db
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_pass
      MYSQL_DATABASE: geonews
      MYSQL_USER: geonews_user
      MYSQL_PASSWORD: geonews_password
    volumes:
      - ./docker/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
