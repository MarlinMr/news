<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GeoNews API Diagnostics Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
        .status { padding: 10px; font-weight: bold; margin-bottom: 10px; border-radius: 4px; }
        .success { background: #1b5e20; color: #81c784; }
        .error { background: #b71c1c; color: #e57373; }
        pre { background: #2d2d2d; padding: 15px; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; }
    </style>
</head>
<body>

    <h2>GeoNews Backend Connectivity Test</h2>
    <div id="status" class="status">Connecting to backend...</div>

    <h3>Raw JSON Output from Database:</h3>
    <pre id="output">Waiting for response...</pre>

    <script>
        async function runTest() {
            const statusEl = document.getElementById('status');
            const outputEl = document.getElementById('output');

            // Set date window to broad range (2000 to today)
            const startDate = '2000-01-01';
            const endDate = new Date().toISOString().split('T')[0];
            const testUrl = `api/articles.php?start_date=${startDate}&end_date=${endDate}`;

            try {
                const response = await fetch(testUrl);

                if (!response.ok) {
                    statusEl.className = 'status error';
                    statusEl.innerText = `HTTP Error ${response.status}: ${response.statusText}`;
                    outputEl.innerText = await response.text();
                    return;
                }

                const data = await response.json();

                statusEl.className = 'status success';
                statusEl.innerText = `SUCCESS! Successfully fetched ${data.length} records from database.`;
                outputEl.innerText = JSON.stringify(data, null, 2);

            } catch (err) {
                statusEl.className = 'status error';
                statusEl.innerText = `FETCH FAILED: ${err.message}`;
                outputEl.innerText = 'Check browser console (F12) for detailed network/CORS error logs.';
            }
        }

        runTest();
    </script>
</body>
</html>
