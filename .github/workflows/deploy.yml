name: Deploy to one.com

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy to one.com (~/webroots/www/news)
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Latest Code
        uses: actions/checkout@v4

      - name: 📂 Deploy via rsync over SSH
        env:
          SSHPASS: ${{ secrets.ONECOM_SFTP_PASSWORD }}
          HOST: ${{ secrets.ONECOM_SFTP_HOST }}
          USER: ${{ secrets.ONECOM_SFTP_USER }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y sshpass rsync
          sshpass -e rsync -avz \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -q" \
            --exclude '.git*' \
            --exclude 'docker/' \
            --exclude 'Dockerfile' \
            --exclude 'docker-compose.yml' \
            --exclude 'GEMINI.md' \
            --exclude 'test.html' \
            --exclude 'api/db.php' \
            --exclude 'api/db.php.example' \
            --exclude 'api/config.php' \
            --exclude '.env*' \
            ./ "$USER"@"$HOST":webroots/www/news/
