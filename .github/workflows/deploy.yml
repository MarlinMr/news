name: Deploy to one.com

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy to one.com (~/webroots/www/news)
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Latest Code
        uses: actions/checkout@v4

      - name: 📦 Prepare Deployment Files
        run: |
          mkdir -p deploy_dist
          cp index.html bulk-update.html deploy_dist/
          cp -r api deploy_dist/
          cp -r docs deploy_dist/
          printf '{"built_date":"%s"}\n' "$(TZ=Europe/Oslo date +%F)" > deploy_dist/build-date.json
          # Ensure server's live database config is not overwritten
          rm -f deploy_dist/api/db.php deploy_dist/api/db.php.example deploy_dist/api/config.php

      - name: 🚀 Deploy via SCP
        env:
          SSH_KEY: ${{ secrets.SSH_KEY || secrets.ONECOM_SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST || secrets.ONECOM_SFTP_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME || secrets.ONECOM_SFTP_USER }}
          FILE_DIR: "webroots/www/news"
        run: |
          # Handle both base64-encoded and raw OpenSSH private keys
          if echo "$SSH_KEY" | grep -q "PRIVATE KEY"; then
            echo "$SSH_KEY" > ssh_key
          else
            echo "$SSH_KEY" | base64 -d > ssh_key
          fi
          chmod 600 ssh_key

          # Ensure target directory structure exists
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ssh_key "$SSH_USERNAME@$SSH_HOST" "mkdir -p $FILE_DIR/api"

          # Deploy files using legacy SCP (-O) compatible with one.com
          scp -O -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ssh_key -r deploy_dist/* "$SSH_USERNAME@$SSH_HOST:$FILE_DIR/"
