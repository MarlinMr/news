name: Deploy to one.com

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: SFTP Deploy to one.com
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Latest Code
        uses: actions/checkout@v4

      - name: 📂 SFTP Deploy to ~/webroots/www/news
        env:
          SFTP_HOST: ${{ secrets.ONECOM_SFTP_HOST }}
          SFTP_USER: ${{ secrets.ONECOM_SFTP_USER }}
          SFTP_PASS: ${{ secrets.ONECOM_SFTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y lftp
          lftp -u "$SFTP_USER","$SFTP_PASS" -e "
            set sftp:auto-confirm yes;
            set ssl:verify-certificate no;
            mirror -R --verbose \
              --exclude-glob .git* \
              --exclude-glob docker/ \
              --exclude-glob Dockerfile \
              --exclude-glob docker-compose.yml \
              --exclude-glob GEMINI.md \
              --exclude-glob test.html \
              --exclude-glob api/db.php \
              --exclude-glob api/db.php.example \
              --exclude-glob api/config.php \
              --exclude-glob .env* \
              ./ webroots/www/news/;
            quit
          " sftp://"$SFTP_HOST":22
